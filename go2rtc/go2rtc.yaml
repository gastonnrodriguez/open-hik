# open-hik stream configuration
# DVR credentials come from the .env file (see .env.example).
#
# Hikvision RTSP path reference:
#   /Streaming/Channels/101  -> camera 1, main stream (high quality)
#   /Streaming/Channels/102  -> camera 1, sub stream  (low bandwidth)
#   /Streaming/Channels/201  -> camera 2, main stream ... and so on
#
# Add or remove streams freely: the web UI discovers them automatically.
# If your password has special characters, URL-encode them (@ -> %40, etc).

api:
  listen: ":1984"
  origin: "*"

webrtc:
  listen: ":8555"
  # For lowest latency from other devices on your LAN, uncomment and set
  # the IP of the machine running open-hik:
  # candidates:
  #   - 192.168.1.50:8555

# The grid uses sub streams (x02) to stay inside the DVR's outgoing bandwidth
# budget; the web app switches to the "-hd" main stream in fullscreen.
streams:
  cam-1: rtsp://${DVR_USER}:${DVR_PASS}@${DVR_HOST}:554/Streaming/Channels/102#backchannel=0
  cam-2: rtsp://${DVR_USER}:${DVR_PASS}@${DVR_HOST}:554/Streaming/Channels/202#backchannel=0
  cam-3: rtsp://${DVR_USER}:${DVR_PASS}@${DVR_HOST}:554/Streaming/Channels/302#backchannel=0
  cam-4: rtsp://${DVR_USER}:${DVR_PASS}@${DVR_HOST}:554/Streaming/Channels/402#backchannel=0
  cam-1-hd: rtsp://${DVR_USER}:${DVR_PASS}@${DVR_HOST}:554/Streaming/Channels/101#backchannel=0
  cam-2-hd: rtsp://${DVR_USER}:${DVR_PASS}@${DVR_HOST}:554/Streaming/Channels/201#backchannel=0
  cam-3-hd: rtsp://${DVR_USER}:${DVR_PASS}@${DVR_HOST}:554/Streaming/Channels/301#backchannel=0
  cam-4-hd: rtsp://${DVR_USER}:${DVR_PASS}@${DVR_HOST}:554/Streaming/Channels/401#backchannel=0
